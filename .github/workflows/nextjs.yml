# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: GitHub Pages deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_TYPE: production
      NEXT_PUBLIC_BASE_URL: https://itsvinayak.github.io
      NEXT_PUBLIC_SITE_URL: https://itsvinayak.github.io
      BLOG_URL: 'https://dev.to/itsvinayak'
      BLOG_NUMBER_OF_POSTS: '20'

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"

      - name: Installing my packages
        run: npm ci

      - name: Build my App
        run: npm run build && touch ./out/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: public # The branch the action should deploy to.
          folder: out # The folder the action should deploy to.